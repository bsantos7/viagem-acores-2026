    <title>Açores 2026</title>
    <style>
        :root {
            --primary: #2C5763;
            --secondary: #61A5B8; <!--#EFCB68;-->
            --ink: #10211D;
            --muted: #5C6F68;
            --shadow: 0 6px 18px #071816;
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        body {
            background: var(--secondary);
            color: var(--ink);
            font-family: "Segoe UI", Arial, sans-serif;
            line-height: 1.5;
            margin: 0
        }

        button {
            background: white;
            border: 1px solid white;
            border-radius: 7px;
            color: var(--ink);
            cursor: pointer;
            font: inherit;
            padding: .58rem .78rem
        }

            button[aria-selected="true"] {
                background: var(--primary);
                border-color: white;
                color: white
            }

            button.nav {
                color: var(--primary);
                font-size: 20px
            }

                button.nav.prev {
                    padding: 3px 12px 3px 10px
                }

                button.nav.next {
                    padding: 3px 10px 3px 12px
                }

        main {
            margin: 0 auto;
            padding: 2% 0;
            width: 95%
        }

        .header {
			background: white;
			box-shadow: var(--shadow);
			height: 53px;
			left: 0;
			padding: 0;
            position: fixed;
			text-align: center;
			top: 0;
			width: 100%;
			z-index: 999
        }

        h2 {
            font-size: clamp(1.45rem, 3vw, 2.05rem);
            line-height: 1.1;
            margin: 0
        }

        h3 {
            font-size: 1.04rem;
            margin: 0 0 .45rem
        }

        p {
            margin: .35rem 0 0
        }

        .muted {
            color: var(--muted)
        }

        .nav-strip {
            padding: 13px
        }

            .nav-strip a {
				background: var(--primary);
				border-radius: 999px;
				color: white;
				font-size: 18px;
				font-weight: bold;
				margin: 0 2px;
				padding: 8px 12px;
                text-decoration: none
            }

        .key-item {
            align-items: start;
            background: white;
            border: 1px solid black;
            border-radius: 7px;
            display: grid;
            padding: .78rem;
            gap: .75rem;
            grid-template-columns: auto 1fr
        }

        .key-icon {
            background: #E2EDF1;
            border-radius: 7px;
            color: #19546e;
            display: grid;
            font-weight: 800;
            height: 2.15rem;
            place-items: center;
            width: 2.15rem
        }

        .stat, .card {
            background: white;
            border: 1px solid white;
            border-radius: 8px;
            box-shadow: var(--shadow);
            overflow: hidden
        }

        .stat {
            align-content: space-between;
            display: grid;
            min-height: 8.2rem;
            padding: 1rem
        }

            .stat small, .meta small {
                color: var(--muted);
                display: block
            }

            .stat strong {
                display: block;
                font-size: clamp(1.45rem, 4vw, 2.2rem);
                line-height: 1.05;
                margin: .45rem 0
            }

        section {
            padding: 1.5rem 0;
            scroll-margin-top: 1rem
        }

        .section-head {
            align-items: end;
            color: white;
            display: flex;
            gap: 1rem;
            justify-content: space-between;
            margin-bottom: .85rem;
            text-shadow: 0 1px 20px black
        }

            .section-head .muted {
                color: white
            }

        .grid {
            display: grid;
            gap: 1rem
        }

            .grid.two {
                grid-template-columns: repeat(2, minmax(0, 1fr))
            }

            .grid.three {
                grid-template-columns: repeat(3, minmax(0, 1fr))
            }

        .pad {
            padding: .7rem
        }

        .status {
            border-radius: 999px;
            display: inline-flex;
            font-size: .82rem;
            font-weight: 700;
            margin-bottom: 10px;
            padding: .22rem .58rem;
            width: fit-content
        }

            .status.ok {
                background: #E0E9E5;
                color: #245443
            }

            .status.warn {
                background: #F5E9DE;
                color: #814b17
            }

        .timeline {
            display: grid;
            gap: .82rem;
            position: relative
        }

        .event {
            align-items: stretch;
            display: grid;
            gap: .8rem;
            grid-template-columns: 10.4rem 1fr
        }

        .event-date {
            background: var(--primary);
            border: 1px solid white;
            border-radius: 7px;
            box-shadow: var(--shadow);
            color: white;
            font-weight: 800;
            padding: .7rem
        }

        .media {
            background-color: white;
            background-position: center;
            background-size: cover;
            min-height: 19rem
        }

        .accommodation {
            display: grid;
            grid-template-columns: 1.05fr .95fr;
            min-height: 23rem
        }

        .photo-grid {
            display: grid;
            gap: .5rem;
            grid-template-columns: 1fr 1fr;
            margin-top: .8rem
        }

            .photo-grid div {
                min-height: 19rem;
                border-radius: 7px;
                background-size: cover;
                background-position: center;
            }

        .meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: .7rem;
            margin: 1rem 0;
        }

            .meta > div {
                border: 1px solid black;
                border-radius: 7px;
                padding: .72rem;
                background: white;
            }

        .tabs {
            display: none; <!--flex-->
            flex-wrap: wrap;
            gap: .45rem;
            margin-bottom: .85rem;
        }

        .slide-shell {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr);
            gap: 1rem;
            align-items: stretch;
        }

        .slide-photo {
            min-height: 33rem;
            background-size: cover;
            background-position: center;
            position: relative;
        }

            .slide-photo::after {
                content: "";
                position: absolute;
                inset: 0;
            }

        .map {
            position: relative;
        }

            .map a {
                position: absolute;
                height: 100%;
                align-content: center;
                right: 20px;
                font-weight: bold;
                top: 0;
                color: var(--primary);
                text-decoration: none;
            }

        .caption {
            position: absolute;
            z-index: 1;
            left: 1rem;
            right: 1rem;
            bottom: 1rem;
            color: white;
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 1rem;
        }

            .caption h3 {
                font-size: clamp(1.7rem, 5vw, 3rem);
                line-height: 1;
                margin: .35rem 0 0;
            }

        .slide-controls {
            display: flex;
            gap: .5rem;
            align-items: center;
        }

        .list {
            display: grid;
            gap: .72rem;
        }

        .row {
            display: grid;
            grid-template-columns: 50% 50%;
            gap: 1rem;
            align-items: center;
            padding: .82rem;
            border-radius: 7px;
            background: white;
        }

            .row.one {
                grid-template-columns: 100% auto
            }

        .money {
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-weight: 800;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: .78rem;
            border-bottom: 1px solid black;
            text-align: left;
            vertical-align: top;
        }

        th {
            color: var(--muted);
            font-size: .86rem;
        }

            td:last-child, th:last-child {
                text-align: right;
            }

        @media (max-width: 900px) {
            .grid.two, .grid.three, .accommodation, .slide-shell {
                grid-template-columns: 1fr;
            }

            .slide-photo {
                min-height: 24rem;
            }

            .header .nav-strip .menuText {
                display: none
            }
			
			.googleMaps {
				height: 400px
			}
        }

        @media (max-width: 560px) {
            main {
                width: min(100% - 1rem, 1180px);
            }

            .event {
                grid-template-columns: 1fr;
            }

            .meta, .row {
                grid-template-columns: 1fr;
            }

            .money {
                text-align: left;
            }

            .photo-grid {
                grid-template-columns: 1fr;
            }

            .caption {
                align-items: start;
                flex-direction: column;
            }

            .tabs button {
                flex: 1 1 auto;
            }
        }

        @media print {
            body {
                background: white;
            }

            .section-head {
                color: var(--ink);
                text-shadow: none;
            }

                .section-head .muted {
                    color: var(--muted);
                }

            .card, .stat {
                box-shadow: none;
                backdrop-filter: none;
                break-inside: avoid;
            }

            .slide-controls, .tabs, .nav-strip {
                display: none;
            }

            .slide-photo, .media {
                min-height: 10rem;
                print-color-adjust: exact;
            }
        }
    </style>
</head>

            return total ? Math.max(0, Math.min(100, Math.round((paid / total) * 100))) : 0;

                acc.paid += Number(p.paid || 0);
                return acc;
            }, { total: 0, paid: 0 });
            values.remaining = Math.max(0, values.total - values.paid);
            return values;
        }

        function render() {
            renderTimeline();
            renderFlights();
            renderStay();
            renderCar();
            renderInterests();
            renderFoods();
			loadImages()
        }

        function renderTimeline() {
            const plannedItems = [
                ...data.interests.filter(i => i.plannedDate && i.plannedDate.toLowerCase() !== "por marcar").map(i => ({ date: i.plannedDate, title: i.name, detail: `${i.duration} · ${i.cost}` })),
                ...data.foods.filter(i => i.plannedDate && i.plannedDate.toLowerCase() !== "por marcar").map(i => ({ date: i.plannedDate, title: `Provar: ${i.name}`, detail: `${i.local} · ${i.cost}` }))
            ].sort((a, b) => a.date.localeCompare(b.date));

            const items = [
                { date: data.flights.outbound_date + " " + data.flights.outbound_depart, title: `Voo de ida: ${data.flights.from} - ${data.flights.to}`, detail: `${data.flights.outbound_depart} - ${data.flights.outbound_arrive} · ${data.flights.airline}` },
                { date: data.car.pickupTime, title: `Recolha do carro: ${data.car.pickupPlace}`, detail: data.car.model },
                { date: data.accommodation.checkIn, title: `Check-in: ${data.accommodation.name}`, detail: data.accommodation.address },
                ...plannedItems.map(i => ({ date: i.date, title: i.title, detail: i.detail })),
                { date: data.accommodation.checkOut, title: "Check-out", detail: data.accommodation.name },
                { date: data.car.dropoffTime, title: `Entrega do carro · ${data.car.dropoffPlace}`, detail: data.car.company },
                { date: data.flights.return_date + " " + data.flights.return_depart, title: `Voo de volta: ${data.flights.from} - ${data.flights.to}`, detail: `${data.flights.return_depart} - ${data.flights.return_arrive} · ${data.flights.airline}` }
            ];
            document.getElementById("timeline").innerHTML = items.map(item => `
        <article class="event">
          <div class="event-date">${item.date}</div>
          <div class="card pad"><h3>${item.title}</h3><p class="muted">${item.detail}</p></div>
        </article>
      `).join("");
        }

        function renderFlights() {
            document.getElementById("flights").innerHTML = `<article class="card pad">
          <span class="status ${data.flights.paid >= data.flights.total ? "ok" : "warn"}">${data.flights.paid >= data.flights.total ? "Valor pago: " + euro(data.flights.total) : euro(data.flights.paid) + " pagos de " + euro(data.flights.total)}</span>
          <h3>Ida · ${data.flights.outbound_date}</h3>
          <div class="row">
			<div><strong>${data.flights.from}</strong><p class="muted">Partida ${data.flights.outbound_depart}</p></div>
			<div><strong>${data.flights.to}</strong><p class="muted">Chegada ${data.flights.outbound_arrive}</p></div>
          </div>
          <h3>Volta · ${data.flights.return_date}</h3>
          <div class="row">
			<div><strong>${data.flights.to}</strong><p class="muted">Partida ${data.flights.return_depart}</p></div>
			<div><strong>${data.flights.from}</strong><p class="muted">Chegada ${data.flights.return_arrive}</p></div>
          </div>
          <h3>Bagagens</h3>
          <div class="row one">
			<div>${data.flights.bags}</p></div>
          </div>
        </article>`;
        }

        function renderStay() {
            const stay = data.accommodation;
            document.getElementById("stay").innerHTML = `
        <div class="media" style='${img(stay.photos[0] || "")}'></div>
        <div class="pad">
          <span class="status ${stay.paid >= stay.total ? "ok" : "warn"}">${stay.paid >= stay.total ? "Valor pago: " + euro(stay.total) : euro(stay.paid) + " pagos de " + euro(stay.total)}</span>
          <h3>${stay.name}</h3>
          <div class="meta">
            <div class="map"><small>Localização</small><strong>${stay.address}</strong><a href="${stay.location}" target="_blank">NAVEGAR ❯</a></div>
            <div><small>Check-in</small><strong>${stay.checkIn}</strong></div>
            <div><small>Check-out</small><strong>${stay.checkOut}</strong></div>
            <div class="map"><small>Anfitrião</small><strong>${stay.host}</strong><a href="${stay.moreInfo}" target="_blank">MAIS INFORMAÇÕES ❯</a></div>
          </div>
          <p class="muted">${stay.notes}</p>
          <div class="photo-grid">${stay.photos.slice(1, 5).map(p => `<div style='${img(p)}'></div>`).join("")}</div>
        </div>
      `;
        }

        function renderCar() {
            const car = data.car;
            const info = [
                ["Empresa", car.company], ["Modelo", car.model], ["Recolha", car.pickupTime + "<br>" + car.pickupPlace], ["Entrega", car.dropoffTime + "<br>" + car.dropoffPlace],
                ["Estado do combustível", car.fuelState], ["Caução", euro(car.deposit)], /*["Por pagar", euro(Math.max(0, car.total - car.paid))]*/
            ];
            document.getElementById("car").innerHTML = `
        <article class="card pad">
          <span class="status ${car.paid >= car.total ? "ok" : "warn"}">${car.paid >= car.total ? "Valor pago: " + euro(car.total) : euro(car.paid) + " pagos de " + euro(car.total)}</span>
          <div class="meta">${info.map(i => `<div><small>${i[0]}</small><strong>${i[1]}</strong></div>`).join("")}</div>

          <br><div><div><h3>Notas</h3><p>${car.notes}</p></div></div>
        </article>
      `;
        }

        function renderSlide(collection, activeIndex, tabId, photoId, detailsId, prefix) {
            const tabs = document.getElementById(tabId);
            tabs.innerHTML = collection.map((item, index) => `
        <button type="button" role="tab" aria-selected="${index === activeIndex}" data-index="${index}">${item.name}</button>
      `).join("");
            tabs.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
                if (prefix === "interest") activeInterest = Number(btn.dataset.index);
                else activeFood = Number(btn.dataset.index);
                prefix === "interest" ? renderInterests() : renderFoods();
            }));

            const item = collection[activeIndex] || {};
            document.getElementById(photoId).style = img(item.image || "");
            document.getElementById(photoId).innerHTML = `
        <div class="caption">
          <div><h3>${item.name || "Item"}</h3></div>
          <div class="slide-controls">
            <button type="button" class="nav prev" id="${prefix}Prev" aria-label="Anterior">❮</button>
            <button type="button" class="nav next" id="${prefix}Next" aria-label="Seguinte">❯</button>
          </div>
        </div>`;

            const isFood = prefix === "food";
            document.getElementById(detailsId).innerHTML = `
        <span class="status ${String(item.cost).toLowerCase().includes("grat") || String(item.cost).toLowerCase().includes("baixo") ? "ok" : "warn"}">${item.cost || "Custo por definir"}</span>
        <h3>${item.name || "Por definir"}</h3>
        <p>${item.description || ""}</p>
        <div class="meta">
          <div><small>Data prevista</small><strong>${item.plannedDate || "Por marcar"}</strong></div>
          <div class="map"><small>Zona</small><strong>${item.local}</strong><a href="${item.location}" target="_blank">NAVEGAR ❯</a></div>
          <div><small>${isFood ? "Local sugerido" : "Duração"}</small><strong>${isFood ? item.place || "-" : item.duration || "-"}</strong></div>
          <div><small>Prioridade</small><strong>${item.priority || "-"}</strong></div>
        </div>
        ${item.notes != "" ? "<h3>Notas</h3><p class=muted>" + item.notes + "</p>" : ""}
      `;

            document.getElementById(`${prefix}Prev`).addEventListener("click", () => {
                if (prefix === "interest") {
                    activeInterest = (activeInterest - 1 + data.interests.length) % data.interests.length;
                    renderInterests();
                } else {
                    activeFood = (activeFood - 1 + data.foods.length) % data.foods.length;
                    renderFoods();
                }
            });
            document.getElementById(`${prefix}Next`).addEventListener("click", () => {
                if (prefix === "interest") {
                    activeInterest = (activeInterest + 1) % data.interests.length;
                    renderInterests();
                } else {
                    activeFood = (activeFood + 1) % data.foods.length;
                    renderFoods();
                }
            });
        }

        function renderInterests() {
            if (activeInterest >= data.interests.length) activeInterest = 0;
            renderSlide(data.interests, activeInterest, "interestTabs", "interestPhoto", "interestDetails", "interest");
        }

        function renderFoods() {
            if (activeFood >= data.foods.length) activeFood = 0;
            renderSlide(data.foods, activeFood, "foodTabs", "foodPhoto", "foodDetails", "food");
        }
		
		function loadImages() {
			data.accommodation.photos.forEach(src => {
				const link = document.createElement("link");
				link.rel = "preload";
				link.as = "image";
				link.href = src;
				document.head.appendChild(link);
			});
			
			data.interests.forEach(src => {
				const link = document.createElement("link");
				link.rel = "preload";
				link.as = "image";
				link.href = src.image;
				document.head.appendChild(link);
			});
			
			data.foods.forEach(src => {
				const link = document.createElement("link");
				link.rel = "preload";
				link.as = "image";
				link.href = src.image;
				document.head.appendChild(link);
			});
		}

        render();
  </script>
</body>
</html>
